<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="2026 World Cup flag quiz - Mini Daily">
    <title>World Cup Flag Quiz - Mini Daily</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='worldcup_flag_quiz.css') }}">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='favicon.svg') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://flagcdn.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="{{ url_for('static', path='shared-utils.js') }}"></script>
</head>

<body class="dark-theme">
    <div class="particles" id="quiz-particles"></div>

    <main class="app-container quiz-page">
        <section class="quiz-shell" aria-labelledby="quiz-title">
            <header class="quiz-header">
                <div>
                    <p class="quiz-kicker">2026 World Cup</p>
                    <h2 id="quiz-title">Flag Quiz</h2>
                </div>
                <div class="quiz-total" id="quiz-total">48 teams</div>
            </header>

            <div id="quiz" class="quiz-view">
                <div class="quiz-progress" aria-hidden="true">
                    <div class="quiz-progress-bar" id="progressBar"></div>
                </div>
                <div class="quiz-counter" id="counter"></div>

                <div class="flag-frame">
                    <img id="flagImg" src="" alt="National flag">
                </div>

                <div class="reveal" id="reveal" aria-live="polite">&nbsp;</div>

                <div class="quiz-actions" id="guessButtons">
                    <button class="quiz-button quiz-button-primary" id="btnGuess" type="button">Reveal Country</button>
                </div>

                <div class="quiz-actions hidden" id="answerButtons">
                    <button class="quiz-button quiz-button-no" id="btnNo" type="button">Didn't Know</button>
                    <button class="quiz-button quiz-button-yes" id="btnYes" type="button">I Knew It</button>
                </div>
            </div>

            <div id="report" class="report hidden">
                <div class="report-header">
                    <p class="quiz-kicker">Results</p>
                    <div class="score" id="scoreVal"></div>
                    <div class="score-label" id="scoreMsg"></div>
                </div>

                <div class="stats">
                    <div class="stat yes">
                        <div class="num" id="yesCount">0</div>
                        <div class="lbl">Recognized</div>
                    </div>
                    <div class="stat no">
                        <div class="num" id="noCount">0</div>
                        <div class="lbl">Missed</div>
                    </div>
                    <div class="stat">
                        <div class="num" id="totalCount">0</div>
                        <div class="lbl">Total</div>
                    </div>
                </div>

                <div class="result-lists">
                    <section class="result-section all-results" aria-labelledby="all-flags-title">
                        <h3 id="all-flags-title">All Flags</h3>
                        <ul class="flag-list flag-results-list" id="allFlagsList"></ul>
                    </section>
                </div>

                <button class="quiz-button quiz-button-primary btn-retry" id="btnRetry" type="button">Restart</button>
            </div>
        </section>
    </main>

    <script src="{{ url_for('static', path='worldcup_flag_quiz.js') }}"></script>
</body>

</html>
