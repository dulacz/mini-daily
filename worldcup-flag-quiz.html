<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026 World Cup Flag Quiz</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --yes: #22c55e;
      --no: #ef4444;
      --text: #e2e8f0;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: linear-gradient(160deg, #0f172a, #1e293b);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    h1 {
      font-size: 1.35rem;
      margin-bottom: 4px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 20px;
    }

    .progress-wrap {
      background: #0f172a;
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width 0.3s ease;
    }

    .counter {
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .flag-frame {
      background: #0f172a;
      border-radius: 14px;
      padding: 20px;
      margin-bottom: 22px;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flag-frame img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
    }

    .buttons {
      display: flex;
      gap: 14px;
    }

    button {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      color: #fff;
      transition: transform 0.08s ease, filter 0.15s ease;
    }

    button:active {
      transform: scale(0.97);
    }

    button:hover {
      filter: brightness(1.1);
    }

    .btn-yes {
      background: var(--yes);
    }

    .btn-no {
      background: var(--no);
    }

    .btn-guess {
      background: var(--accent);
      color: #0f172a;
    }

    .hint {
      margin-top: 16px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .reveal {
      min-height: 1.6rem;
      margin-bottom: 16px;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .reveal.show {
      opacity: 1;
    }

    /* Report */
    .report {
      text-align: left;
    }

    .report h2 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .score {
      text-align: center;
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--accent);
      margin: 10px 0 4px;
    }

    .score-label {
      text-align: center;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .stats {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .stat {
      flex: 1;
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .stat .num {
      font-size: 1.6rem;
      font-weight: 700;
    }

    .stat .lbl {
      font-size: 0.78rem;
      color: var(--muted);
    }

    .stat.yes .num {
      color: var(--yes);
    }

    .stat.no .num {
      color: var(--no);
    }

    .list-title {
      font-size: 0.95rem;
      margin: 14px 0 8px;
      color: var(--text);
    }

    ul.flag-list {
      list-style: none;
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid #334155;
      border-radius: 10px;
    }

    ul.flag-list li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 10px;
      border-bottom: 1px solid #334155;
      font-size: 0.82rem;
      min-height: 34px;
    }

    ul.flag-list li:last-child {
      border-bottom: none;
    }

    ul.flag-list img {
      width: 22px;
      height: auto;
      border-radius: 3px;
      flex-shrink: 0;
    }

    .flag-name {
      flex: 1;
      min-width: 0;
    }

    .flag-status {
      border-radius: 999px;
      flex-shrink: 0;
      font-size: 0.68rem;
      font-weight: 700;
      line-height: 1;
      padding: 4px 7px;
      white-space: nowrap;
    }

    .flag-status.recognized {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
    }

    .flag-status.missed {
      background: rgba(239, 68, 68, 0.16);
      color: #f87171;
    }

    .empty-note {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 10px 0;
    }

    .btn-retry {
      background: var(--accent);
      color: #0f172a;
      margin-top: 22px;
      width: 100%;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="app">
    <h1>🏆 2026 World Cup Flag Quiz</h1>
    <p class="subtitle">Reveal the country, then say if you recognized it.</p>

    <!-- Quiz view -->
    <div id="quiz">
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="counter" id="counter"></div>
      <div class="flag-frame"><img id="flagImg" src="" alt="National flag"></div>
      <div class="reveal" id="reveal">&nbsp;</div>
      <div class="buttons" id="guessButtons">
        <button class="btn-guess" id="btnGuess">Reveal country (Space)</button>
      </div>
      <div class="buttons hidden" id="answerButtons">
        <button class="btn-no" id="btnNo">Didn't know ✗</button>
        <button class="btn-yes" id="btnYes">I knew it ✓</button>
      </div>
      <p class="hint" id="hint">Press <strong>Space</strong> to reveal</p>
    </div>

    <!-- Report view -->
    <div id="report" class="report hidden">
      <h2>Your Results</h2>
      <div class="score" id="scoreVal"></div>
      <div class="score-label" id="scoreMsg"></div>
      <div class="stats">
        <div class="stat yes">
          <div class="num" id="yesCount">0</div>
          <div class="lbl">Recognized</div>
        </div>
        <div class="stat no">
          <div class="num" id="noCount">0</div>
          <div class="lbl">Missed</div>
        </div>
        <div class="stat">
          <div class="num" id="totalCount">0</div>
          <div class="lbl">Total</div>
        </div>
      </div>

      <div class="list-title">All flags:</div>
      <ul class="flag-list" id="allFlagsList"></ul>

      <button class="btn-retry" id="btnRetry">Restart</button>
    </div>
  </div>

  <script>
    // All 48 qualified teams for the 2026 FIFA World Cup.
    // code = ISO country code used by flagcdn.com (gb-eng / gb-sct for England / Scotland).
    const TEAMS = [
      { name: "United States", code: "us" },
      { name: "Mexico", code: "mx" },
      { name: "Canada", code: "ca" },
      { name: "Spain", code: "es" },
      { name: "Argentina", code: "ar" },
      { name: "France", code: "fr" },
      { name: "England", code: "gb-eng" },
      { name: "Brazil", code: "br" },
      { name: "Portugal", code: "pt" },
      { name: "Netherlands", code: "nl" },
      { name: "Belgium", code: "be" },
      { name: "Germany", code: "de" },
      { name: "Croatia", code: "hr" },
      { name: "Morocco", code: "ma" },
      { name: "Colombia", code: "co" },
      { name: "Uruguay", code: "uy" },
      { name: "Switzerland", code: "ch" },
      { name: "Japan", code: "jp" },
      { name: "Senegal", code: "sn" },
      { name: "Iran", code: "ir" },
      { name: "South Korea", code: "kr" },
      { name: "Ecuador", code: "ec" },
      { name: "Austria", code: "at" },
      { name: "Australia", code: "au" },
      { name: "Norway", code: "no" },
      { name: "Panama", code: "pa" },
      { name: "Egypt", code: "eg" },
      { name: "Algeria", code: "dz" },
      { name: "Scotland", code: "gb-sct" },
      { name: "Paraguay", code: "py" },
      { name: "Tunisia", code: "tn" },
      { name: "Ivory Coast", code: "ci" },
      { name: "Uzbekistan", code: "uz" },
      { name: "Qatar", code: "qa" },
      { name: "Saudi Arabia", code: "sa" },
      { name: "South Africa", code: "za" },
      { name: "Jordan", code: "jo" },
      { name: "Cape Verde", code: "cv" },
      { name: "Ghana", code: "gh" },
      { name: "Curaçao", code: "cw" },
      { name: "Haiti", code: "ht" },
      { name: "New Zealand", code: "nz" },
      { name: "Bosnia and Herzegovina", code: "ba" },
      { name: "Sweden", code: "se" },
      { name: "Turkey", code: "tr" },
      { name: "Czech Republic", code: "cz" },
      { name: "Iraq", code: "iq" },
      { name: "DR Congo", code: "cd" }
    ];

    const flagBig = code => `https://flagcdn.com/w320/${code}.png`;
    const flagSmall = code => `https://flagcdn.com/w40/${code}.png`;

    let order = [];
    let current = 0;
    let answers = []; // { team, known: bool }
    let revealed = false; // true once the country name is shown for the current flag

    const $ = id => document.getElementById(id);

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startQuiz() {
      order = shuffle(TEAMS);
      current = 0;
      answers = [];
      $("report").classList.add("hidden");
      $("quiz").classList.remove("hidden");
      renderFlag();
    }

    function renderFlag() {
      const team = order[current];
      revealed = false;
      $("flagImg").src = flagBig(team.code);
      $("flagImg").alt = "National flag " + (current + 1);
      $("counter").textContent = `Flag ${current + 1} of ${order.length}`;
      $("progressBar").style.width = `${(current / order.length) * 100}%`;
      const reveal = $("reveal");
      reveal.classList.remove("show");
      reveal.innerHTML = "&nbsp;";
      $("guessButtons").classList.remove("hidden");
      $("answerButtons").classList.add("hidden");
      $("hint").innerHTML = "Press <strong>Space</strong> to reveal";
    }

    function revealCountry() {
      if (revealed) return;
      revealed = true;
      const reveal = $("reveal");
      reveal.textContent = order[current].name;
      reveal.classList.add("show");
      $("guessButtons").classList.add("hidden");
      $("answerButtons").classList.remove("hidden");
      $("hint").innerHTML = "Did you know it? <strong>Y</strong> = yes, <strong>N</strong> = no";
    }

    function advance() {
      current++;
      if (current < order.length) {
        renderFlag();
      } else {
        showReport();
      }
    }

    function answer(known) {
      if (!revealed) return;
      answers.push({ team: order[current], known });
      advance();
    }

    function showReport() {
      $("quiz").classList.add("hidden");
      $("report").classList.remove("hidden");

      const known = answers.filter(a => a.known);
      const missed = answers.filter(a => !a.known);
      const total = answers.length;
      const pct = Math.round((known.length / total) * 100);

      $("scoreVal").textContent = `${pct}%`;
      $("scoreMsg").textContent = scoreMessage(pct);
      $("yesCount").textContent = known.length;
      $("noCount").textContent = missed.length;
      $("totalCount").textContent = total;

      fillAllResultsList($("allFlagsList"), answers);
    }

    function scoreMessage(pct) {
      if (pct === 100) return "Perfect! You know every flag. 🌟";
      if (pct >= 80) return "Excellent flag knowledge! 🔥";
      if (pct >= 60) return "Nicely done — a few to brush up on.";
      if (pct >= 40) return "Good start — keep studying!";
      return "Plenty to learn — retry to improve!";
    }

    function fillAllResultsList(ul, items) {
      ul.innerHTML = "";
      if (items.length === 0) {
        const li = document.createElement("li");
        li.innerHTML = `<span class="empty-note">No flags answered yet.</span>`;
        ul.appendChild(li);
        return;
      }
      items.forEach(({ team, known }) => {
        const li = document.createElement("li");
        const img = document.createElement("img");
        img.src = flagSmall(team.code);
        img.alt = team.name;
        const span = document.createElement("span");
        span.className = "flag-name";
        span.textContent = team.name;
        const status = document.createElement("span");
        status.className = known ? "flag-status recognized" : "flag-status missed";
        status.textContent = known ? "Recognized" : "Missed";
        li.appendChild(img);
        li.appendChild(span);
        li.appendChild(status);
        ul.appendChild(li);
      });
    }

    $("btnGuess").addEventListener("click", revealCountry);
    $("btnYes").addEventListener("click", () => answer(true));
    $("btnNo").addEventListener("click", () => answer(false));
    $("btnRetry").addEventListener("click", startQuiz);

    document.addEventListener("keydown", e => {
      if ($("quiz").classList.contains("hidden")) return;
      if (e.key === " " || e.code === "Space") {
        e.preventDefault();
        revealCountry();
      } else if (e.key === "y" || e.key === "Y") {
        answer(true);
      } else if (e.key === "n" || e.key === "N") {
        answer(false);
      }
    });

    startQuiz();
  </script>
</body>

</html>
